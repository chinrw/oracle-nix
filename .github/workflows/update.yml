name: Check Oracle Update

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-release-update
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      version: ${{ steps.candidate.outputs.version }}
      base: ${{ steps.candidate.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the stable npm release
        id: candidate
        run: |
          nix develop -c python3 scripts/update.py > update-result.json
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version update-result.json)" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- package; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --binary -- package > candidate.patch
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.candidate.outputs.changed == 'true'
        with:
          name: oracle-candidate
          path: candidate.patch
          if-no-files-found: error
          retention-days: 3

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      candidate_artifact: oracle-candidate
      candidate_ref: ${{ needs.prepare.outputs.base }}

  publish:
    needs: [prepare, validate]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.changed == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oracle-candidate
          path: /tmp/oracle-candidate
      - name: Publish the validated candidate without rebasing
        env:
          BASE: ${{ needs.prepare.outputs.base }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE" ]; then
            echo 'main changed during validation; the next run will prepare a new candidate.' >&2
            exit 1
          fi
          git apply /tmp/oracle-candidate/candidate.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package/package.json package/package-lock.json package/npm-deps-hash package/skill-source.json
          git commit --signoff -m "oracle: update to $VERSION"
          git push origin HEAD:main
