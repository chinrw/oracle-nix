name: Build Oracle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_artifact:
        type: string
        default: ''
      candidate_ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate_artifact != ''
        with:
          name: ${{ inputs.candidate_artifact }}
          path: /tmp/oracle-candidate
      - name: Apply the candidate tested by this workflow
        if: inputs.candidate_artifact != ''
        run: git apply /tmp/oracle-candidate/candidate.patch
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Check formatting and workflow syntax
        run: |
          nix develop -c nixfmt --check flake.nix package/default.nix
          nix develop -c actionlint
      - name: Build and run offline checks
        run: nix flake check --system '${{ matrix.system }}' --print-build-logs
